<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Casa 5B — caricamento piani affiancati</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#e9eef5;color:#24324a}
    body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.spinner{width:42px;height:42px;margin:0 auto 14px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    .error{max-width:560px;line-height:1.5;color:#991b1b}
  </style>
</head>
<body>
  <div class="loading" id="status"><div class="spinner"></div><strong>Caricamento modello 3D con piani affiancati…</strong></div>
  <script>
  (async()=>{
    const version='20260727-side-by-side-v4';
    const parts=Array.from({length:7},(_,i)=>`payload/final-affiancata-plain/part-${String(i).padStart(2,'0')}?v=${version}`);
    try{
      let html='';
      for(const url of parts){
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
        html+=await response.text();
      }
      const replacements={
        "const cx=(it.cx-floor.imageWidth/2)*SCALE, cz=":"const cx=(it.cx-floor.imageWidth/2)*SCALE + floorOffset(floor.id), cz=",
        "const cx=(x+((i+0.5)*(w/steps))-floor.imageWidth/2)*SCALE;":"const cx=(x+((i+0.5)*(w/steps))-floor.imageWidth/2)*SCALE + floorOffset(floor.id);",
        "const cx=(x+w/2-floor.imageWidth/2)*SCALE;":"const cx=(x+w/2-floor.imageWidth/2)*SCALE + floorOffset(floor.id);",
        "const wx=(px)=> (px-floor.imageWidth/2)*SCALE,":"const wx=(px)=> (px-floor.imageWidth/2)*SCALE + floorOffset(floor.id),"
      };
      for(const [from,to] of Object.entries(replacements)){
        if(!html.includes(from)) throw new Error(`Patch non trovata: ${from}`);
        html=html.replaceAll(from,to);
      }
      if(!html.includes('function floorOffset')) throw new Error('La versione affiancata non è presente nel payload');
      html=html.replace('</head>','<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"></head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.getElementById('status').innerHTML=`<div class="error"><h2>Errore di caricamento</h2><p>${error.message}</p><p>Ricarica la pagina tra qualche secondo.</p></div>`;
      console.error(error);
    }
  })();
  </script>
</body>
</html>
