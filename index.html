<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Casa 5B · Homestyler 3D</title>
<link rel="stylesheet" href="./styles.css"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head><body><main id="viewer"><canvas id="scene"></canvas>
<header class="top glass"><div><small>CASA 5B</small><h1>Homestyler · arredata e texturizzata</h1></div><div class="status"><i></i><span id="status">Caricamento…</span></div></header>
<nav class="floors glass" aria-label="Selezione piano">
<button data-floor="both" class="active">Entrambi</button><button data-floor="first">Primo piano</button><button data-floor="second">Secondo piano</button>
</nav>
<nav class="tools glass"><button id="iso" title="Vista isometrica">◇</button><button id="topview" title="Vista dall’alto">⌂</button><button id="rotate" title="Rotazione automatica">↻</button><button id="full" title="Schermo intero">⛶</button><button id="reset" title="Reimposta">↺</button></nav>
<aside id="info" class="info glass" hidden><button id="close">×</button><small>ELEMENTO SELEZIONATO</small><h2 id="info-title"></h2><p id="info-detail"></p></aside>
<div class="help glass">Trascina per ruotare · rotella/pinch per zoom · tasto destro/due dita per spostare</div>
<div id="loading" class="loading"><div class="ring"></div><strong>Ricostruzione casa Homestyler</strong><span id="progress">Caricamento struttura…</span></div>
</main><script type="module" src="./app.js"></script></body></html>
