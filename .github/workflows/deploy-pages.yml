name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build final side-by-side site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cat payload/final-affiancata-plain/part-* > _site/index.html
          cp .nojekyll _site/.nojekyll
          test "$(wc -c < _site/index.html)" -gt 40000
          grep -q 'Casa 5B — piani affiancati' _site/index.html
          grep -q 'function floorOffset' _site/index.html
          grep -q 'drawFloorLabels' _site/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('_site/index.html').read_text()
          match = re.search(r'<script>(.*)</script>', html, re.S)
          if not match:
              raise SystemExit('Script principale non trovato')
          Path('/tmp/casa-site.js').write_text(match.group(1))
          PY
          node --check /tmp/casa-site.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
