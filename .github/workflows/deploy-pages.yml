name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Link mobile interface in root page
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if ! grep -q 'mobile.css' index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="mobile.css?v=20260727-3"></head>#' index.html
            changed=1
          fi
          if ! grep -q 'mobile.js' index.html; then
            sed -i 's#</body>#<script src="mobile.js?v=20260727-3"></script></body>#' index.html
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Link mobile interface directly [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html mobile.css mobile.js .nojekyll _site/
          grep -q 'mobile.css' _site/index.html
          grep -q 'mobile.js' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
