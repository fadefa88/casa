<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Consumi Totali · Casa 5B</title>
  <link rel="icon" href="./icon.svg">
  <style>
    :root{color-scheme:dark;--bg:#070b14;--surface:rgba(17,24,39,.92);--surface-2:rgba(26,35,52,.88);--line:rgba(255,255,255,.09);--text:#f4f7fb;--muted:#9ca9bb;--accent:#66d9ef;--ok:#73e2a7;--error:#ff7d8d;--radius:20px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:radial-gradient(circle at top,#17233d 0,var(--bg) 46%);color:var(--text)}
    body{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}button,a{font:inherit}
    .shell{width:min(1500px,100%);margin:0 auto}.topbar{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:22px;background:rgba(10,15,27,.88);backdrop-filter:blur(18px);box-shadow:0 16px 50px rgba(0,0,0,.28)}
    .topbar h1{font-size:clamp(18px,2vw,27px);line-height:1.1;margin:0}.topbar-main{min-width:0;flex:1}.action{border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:10px 13px;border-radius:13px;text-decoration:none;font-weight:800}
    .group{margin:22px 0 8px;display:flex;align-items:end;justify-content:space-between;gap:10px}.group h2{margin:0;font-size:clamp(18px,2vw,25px)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .device{min-width:0;padding:15px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,var(--surface),rgba(12,18,31,.94));box-shadow:0 13px 36px rgba(0,0,0,.22)}
    .device-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.device-head h3{margin:0;font-size:18px}.total-device{border-color:rgba(102,217,239,.28);background:linear-gradient(145deg,rgba(23,42,60,.96),rgba(12,18,31,.96))}.total-device .device-head h3{color:var(--accent)}
    .grand-total{grid-column:1/-1;border-color:rgba(115,226,167,.36);background:linear-gradient(145deg,rgba(23,60,50,.96),rgba(12,18,31,.96))}.grand-total .device-head h3{color:var(--ok)}
    .grand-live{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.8fr);gap:10px;margin-top:12px}.grand-live-panel{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.035)}.grand-live-title{display:block;margin-bottom:9px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.power-breakdown{display:flex;flex-wrap:wrap;gap:7px}.power-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(0,0,0,.16);font-size:12px;font-weight:750}.power-chip strong{color:var(--ok);font-variant-numeric:tabular-nums}.power-empty{color:var(--muted);font-size:12px}.house-compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.house-compare div{min-width:0;padding:9px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(0,0,0,.13)}.house-compare small{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.house-compare strong{display:block;margin-top:5px;font-size:16px;font-variant-numeric:tabular-nums}.house-compare .difference-positive strong{color:var(--error)}.house-compare .difference-negative strong{color:var(--accent)}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{min-width:0;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.035)}
    .metric small{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.metric strong{display:block;margin-top:5px;font-size:clamp(18px,2.2vw,27px);line-height:1;font-variant-numeric:tabular-nums}.metric .cost{display:block;margin-top:7px;color:var(--ok);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}.metric .cost[hidden]{display:none}.metric.loading strong{color:var(--muted)}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grand-live{grid-template-columns:1fr}}
    @media(max-width:720px){body{padding:8px}.topbar{border-radius:17px;flex-wrap:wrap}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.house-compare{grid-template-columns:1fr}}
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="topbar-main"><h1>Consumi Totali</h1></div><a class="action" href="./index.html">Casa 3D</a></header>
    <div class="group"><h2>Elettrodomestici</h2></div><section id="appliances" class="grid"></section>
    <div class="group"><h2>Zona TV</h2></div><section id="tv-zone" class="grid"></section>
    <div class="group"><h2>Studio / gaming</h2></div><section id="studio-zone" class="grid"></section>
    <div class="group"><h2>Linee Shelly</h2></div><section id="shelly-lines" class="grid"></section>
    <div class="group"><h2>Totale complessivo</h2></div><section id="grand-total" class="grid"></section>
  </main>
<script>
(()=>{
  'use strict';
  const config=window.CASA_DASHBOARD_CONFIG||{};
  const haConfig=config.homeAssistant||{};
  const fmt=new Intl.NumberFormat('it-IT',{maximumFractionDigits:3});
  const costFmt=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:3});
  const ENERGY_PRICE_EUR_KWH=.287;
  const FIXED_POWER_LOADS=[
    {label:'Alexa',power:3.2},
    {label:'Dispositivi Shelly',power:7},
    {label:'Switch di rete',power:15},
    {label:'Domotica BTicino',power:38},
    {label:'Router 5G',power:8},
    {label:'FRITZ!Box 7690',power:12.5},
    {label:'ONT Fibra',power:4},
    {label:'Rete Mesh',power:24},
    {label:'VMC',power:20}
  ];
  const state={states:new Map(),metrics:new Map(),syncing:false};

  const DEVICES={
    washer:{label:'Lavatrice',powerKey:'washerPower',aliases:['lavatrice','washing machine','washer'],dailyHelper:'sensor.vano_tecnico_shelly_plug_lavatrice_lavatrice_energia_giornaliera',monthlyHelper:'sensor.vano_tecnico_shelly_plug_lavatrice_lavatrice_energia_mensile'},
    fridge:{label:'Frigorifero',powerKey:'fridgePower',aliases:['frigorifero','frigo congelatore','frigo','congelatore','fridge freezer','fridge','freezer'],dailyHelper:'sensor.cucina_shelly_plug_frigo_frigo_energia_giornaliera',monthlyHelper:'sensor.cucina_shelly_plug_frigo_frigo_energia_mensile'},
    oven:{label:'Forno',powerKey:'ovenPower',aliases:['forno','oven'],dailyHelper:'sensor.cucina_shelly_plug_forno_forno_energia_giornaliera',monthlyHelper:'sensor.cucina_shelly_plug_forno_forno_energia_mensile'},
    dishwasher:{label:'Lavastoviglie',powerKey:'dishwasherPower',aliases:['lavastoviglie','lavapiatti','dishwasher'],dailyHelper:'sensor.cucina_shelly_plug_lavastoviglie_lavastoviglie_energia_giornaliera',monthlyHelper:'sensor.cucina_shelly_plug_lavastoviglie_lavastoviglie_energia_mensile'},
    dryer:{label:'Asciugatrice',powerKey:'dryerPower',aliases:['asciugatrice','tumble dryer','dryer'],dailyHelper:'sensor.vano_tecnico_shelly_plug_asciugatrice_asciugatrice_energia_giornaliera',monthlyHelper:'sensor.vano_tecnico_shelly_plug_asciugatrice_asciugatrice_energia_mensile'},
    tv:{label:'TV',powerKey:'tvPower',aliases:['tv','televisore','smart tv','samsung tv'],dailyHelper:'sensor.salotto_tv_energia_giornaliera',monthlyHelper:'sensor.salotto_tv_energia_mensile'},
    shield:{label:'Nvidia Shield',powerKey:'shieldPower',aliases:['nvidia shield','shield tv','shield'],dailyHelper:'sensor.salotto_nvidia_shield_shield_energia_giornaliera',monthlyHelper:'sensor.salotto_nvidia_shield_shield_energia_mensile'},
    mediaPc:{label:'Mini PC',powerKey:'mediaPcPower',aliases:['mini pc','minipc','media mini pc'],dailyHelper:'sensor.salotto_mini_pc_energia_giornaliera',monthlyHelper:'sensor.salotto_mini_pc_energia_mensile'},
    hdd:{label:'HDD',powerKey:'hddPower',aliases:['hdd','hard disk','disco esterno'],dailyHelper:'sensor.salotto_hdd_energia_giornaliera',monthlyHelper:'sensor.salotto_hdd_energia_mensile'},
    pc:{label:'PC',powerKey:'pcPower',aliases:['pc','pc studio','computer studio','office pc','desktop pc'],exclude:['mini pc','minipc','media pc'],dailyHelper:'sensor.studio_pc_energia_giornaliera',monthlyHelper:'sensor.studio_pc_energia_mensile'},
    monitor:{label:'Monitor',powerKey:'monitorPower',aliases:['monitor','monitor studio','office monitor'],dailyHelper:'sensor.studio_monitor_energia_giornaliera',monthlyHelper:'sensor.studio_monitor_energia_mensile'},
    ps5:{label:'PS5',powerKey:'ps5Power',aliases:['ps 5','ps5','playstation 5','playstation5'],dailyHelper:'sensor.studio_ps_5_ps5_energia_giornaliera',monthlyHelper:'sensor.studio_ps_5_ps5_energia_mensile'},
    dock:{label:'Splitter',powerKey:'dockPower',aliases:['splitter','dock studio','office dock','dock'],dailyHelper:'sensor.studio_splitter_energia_giornaliera',monthlyHelper:'sensor.studio_splitter_energia_mensile'},
    heatPump:{label:'Pompa di calore',powerEntity:'sensor.vano_tecnico_shelly_pompa_di_calore_potenza',dailyHelper:'sensor.vano_tecnico_shelly_pompa_di_calore_giornaliero_pompa_calore',monthlyHelper:'sensor.vano_tecnico_shelly_pompa_di_calore_mensile_pompa_calore',annualHelper:'sensor.vano_tecnico_shelly_pompa_di_calore_annuale_pompa_di_calore'},
    induction:{label:'Induzione',powerEntity:'sensor.cucina_shelly_induzione_potenza',dailyHelper:'sensor.cucina_shelly_induzione_induzione_gg',monthlyHelper:'sensor.cucina_shelly_induzione_induzione_kwh_mese',annualHelper:'sensor.cucina_shelly_induzione_induzione_kwh_anno'}
  };
  const GROUPS={appliances:['washer','fridge','oven','dishwasher','dryer'],tv:['tv','shield','mediaPc','hdd'],studio:['pc','monitor','ps5','dock'],shelly:['heatPump','induction']};
  const TOTAL_LABELS={appliances:'Totale Elettrodomestici',tv:'Totale Zona TV',studio:'Totale Studio / gaming',shelly:'Totale Linee Shelly'};
  const normalize=v=>String(v??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const valid=e=>Boolean(e&&!['unknown','unavailable','null','none',''].includes(normalize(e.state)));
  const haBase=()=>String(haConfig.url||'').trim().replace(/\/$/,'');
  const usableConfig=()=>{const t=String(haConfig.token||'');return Boolean(haBase()&&t&&t!=='insert token'&&!t.includes('REPLACE_'))};
  async function haFetch(path){const r=await fetch(`${haBase()}${path}`,{headers:{Authorization:`Bearer ${haConfig.token}`,'Content-Type':'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`Home Assistant ${r.status}`);return r.json()}
  function configuredCandidates(key){const c=config.entities?.[key];return(Array.isArray(c)?c:[c]).filter(Boolean)}
  function unit(entity){return normalize(entity?.attributes?.unit_of_measurement)}
  function isPower(entity){return valid(entity)&&String(entity.entity_id||'').startsWith('sensor.')&&Number.isFinite(Number(entity.state))&&(normalize(entity.attributes?.device_class)==='power'||['w','kw','mw'].includes(unit(entity)))}
  function watts(entity){if(!isPower(entity))return null;const v=Number(entity.state),u=unit(entity);if(u==='kw')return v*1000;if(u==='mw')return v*1000000;return v}
  function energyKwh(entity,raw=entity?.state){if(!entity||!Number.isFinite(Number(raw)))return null;return Number(raw)}
  function entityText(entity){return normalize(`${entity?.entity_id||''} ${entity?.attributes?.friendly_name||''}`)}
  function resolvePower(device){
    if(device.powerEntity){const e=state.states.get(device.powerEntity);return isPower(e)?e:null}
    for(const id of configuredCandidates(device.powerKey)){const e=state.states.get(id);if(isPower(e))return e}
    let best=null,bestScore=0;
    for(const e of state.states.values()){
      if(!isPower(e))continue;const text=entityText(e);if((device.exclude||[]).some(x=>text.includes(normalize(x))))continue;
      let score=0;for(const a of device.aliases){const n=normalize(a);if(text===n)score=Math.max(score,100);else if(text.includes(n))score=Math.max(score,70+n.length)}
      if(text.includes('shelly'))score+=5;if(score>bestScore){bestScore=score;best=e}
    }
    return bestScore>=72?best:null;
  }
  function configuredPower(key){for(const id of configuredCandidates(key)){const value=watts(state.states.get(id));if(Number.isFinite(value))return value}return null}
  function periodValue(device,period){
    const daily=state.states.get(device.dailyHelper)||null,monthly=state.states.get(device.monthlyHelper)||null,annual=state.states.get(device.annualHelper)||null;
    if(period==='today')return energyKwh(daily)??0;
    if(period==='yesterday')return energyKwh(daily,daily?.attributes?.last_period)??0;
    if(period==='month')return energyKwh(monthly)??0;
    if(period==='annual')return energyKwh(annual)??0;
    return 0;
  }
  function formatPower(v){const x=Number.isFinite(v)?v:0;return Math.abs(x)>=1000?`${fmt.format(x/1000)} kW`:`${fmt.format(x)} W`}
  function formatSignedPower(v){const x=Number.isFinite(v)?v:0;return`${x>0?'+':x<0?'−':''}${formatPower(Math.abs(x))}`}
  function formatEnergy(v){return`${fmt.format(Number.isFinite(v)?v:0)} kWh`}
  function formatCost(v){return costFmt.format(Math.max(0,Number.isFinite(v)?v:0)*ENERGY_PRICE_EUR_KWH)}
  function metricHtml(label,kind){const cost=kind==='power'?'<span class="cost" hidden></span>':'<span class="cost">Costo stimato: € 0,00</span>';return`<div class="metric loading" data-kind="${kind}"><small>${label}</small><strong>…</strong>${cost}</div>`}
  function metricsHtml(powerLabel='Attuale'){return`${metricHtml(powerLabel,'power')}${metricHtml('Oggi','today')}${metricHtml('Ieri','yesterday')}${metricHtml('Mese','month')}`}
  function deviceHtml(id){const device=DEVICES[id];const annual=device.annualHelper?metricHtml('Annuale','annual'):'';return`<article class="device" data-device="${id}"><div class="device-head"><h3>${device.label}</h3></div><div class="metrics">${metricsHtml()}${annual}</div></article>`}
  function totalHtml(group){return`<article class="device total-device" data-total="${group}"><div class="device-head"><h3>${TOTAL_LABELS[group]}</h3></div><div class="metrics">${metricsHtml()}</div></article>`}
  function grandTotalHtml(){return`<article class="device total-device grand-total" data-grand-total><div class="device-head"><h3>Totale complessivo</h3></div><div class="metrics">${metricsHtml('Consumo attuale')}</div><div class="grand-live"><div class="grand-live-panel"><span class="grand-live-title">Composizione consumo attuale</span><div class="power-breakdown" data-power-breakdown><span class="power-empty">In attesa dei dati…</span></div></div><div class="grand-live-panel"><span class="grand-live-title">Confronto con Bilancio casa</span><div class="house-compare"><div><small>Bilancio casa</small><strong data-house-power>…</strong></div><div><small>Somma oggetti</small><strong data-counted-power>…</strong></div><div data-power-difference><small>Differenza</small><strong>…</strong></div></div></div></div></article>`}
  function render(){
    document.querySelector('#appliances').innerHTML=GROUPS.appliances.map(deviceHtml).join('')+totalHtml('appliances');
    document.querySelector('#tv-zone').innerHTML=GROUPS.tv.map(deviceHtml).join('')+totalHtml('tv');
    document.querySelector('#studio-zone').innerHTML=GROUPS.studio.map(deviceHtml).join('')+totalHtml('studio');
    document.querySelector('#shelly-lines').innerHTML=GROUPS.shelly.map(deviceHtml).join('')+totalHtml('shelly');
    document.querySelector('#grand-total').innerHTML=grandTotalHtml();
  }
  function patchNode(node,kind,value){if(!node)return;const v=Number.isFinite(value)?value:0;node.querySelector('strong').textContent=kind==='power'?formatPower(v):formatEnergy(v);const c=node.querySelector('.cost');if(c){c.hidden=kind==='power';if(kind!=='power')c.textContent=`Costo stimato: ${formatCost(v)}`}node.classList.remove('loading')}
  function patchDevice(id,kind,value){patchNode(document.querySelector(`[data-device="${id}"] [data-kind="${kind}"]`),kind,value)}
  function patchTotal(group,kind,value){patchNode(document.querySelector(`[data-total="${group}"] [data-kind="${kind}"]`),kind,value)}
  function patchGrand(kind,value){patchNode(document.querySelector(`[data-grand-total] [data-kind="${kind}"]`),kind,value)}
  function patchGrandLive(countedPower){
    const breakdown=document.querySelector('[data-power-breakdown]');
    if(breakdown){
      const active=[
        ...Object.entries(DEVICES).map(([id,device])=>({label:device.label,power:Number(state.metrics.get(id)?.power)||0})).filter(item=>item.power>0.05),
        ...FIXED_POWER_LOADS
      ].sort((a,b)=>b.power-a.power);
      breakdown.innerHTML=active.length?active.map(item=>`<span class="power-chip"><span>${item.label}</span><strong>+${formatPower(item.power)}</strong></span>`).join(''):'<span class="power-empty">Nessun oggetto con consumo rilevato.</span>';
    }
    const housePower=configuredPower('housePower');
    const houseNode=document.querySelector('[data-house-power]');
    const countedNode=document.querySelector('[data-counted-power]');
    const differenceBox=document.querySelector('[data-power-difference]');
    if(houseNode)houseNode.textContent=Number.isFinite(housePower)?formatPower(housePower):'N/D';
    if(countedNode)countedNode.textContent=formatPower(countedPower);
    if(differenceBox){
      differenceBox.classList.remove('difference-positive','difference-negative');
      const difference=Number.isFinite(housePower)?housePower-countedPower:null;
      const strong=differenceBox.querySelector('strong');
      if(strong)strong.textContent=Number.isFinite(difference)?formatSignedPower(difference):'N/D';
      if(Number.isFinite(difference)&&difference>0.5)differenceBox.classList.add('difference-positive');
      else if(Number.isFinite(difference)&&difference<-0.5)differenceBox.classList.add('difference-negative');
    }
  }
  function updateDevice(id){const d=DEVICES[id],p=watts(resolvePower(d));const values={power:Number.isFinite(p)?p:0,today:periodValue(d,'today'),yesterday:periodValue(d,'yesterday'),month:periodValue(d,'month')};if(d.annualHelper)values.annual=periodValue(d,'annual');state.metrics.set(id,values);for(const[k,v]of Object.entries(values))patchDevice(id,k,v)}
  function updateTotals(){
    for(const[group,ids]of Object.entries(GROUPS)){const t={power:0,today:0,yesterday:0,month:0};for(const id of ids){const v=state.metrics.get(id)||{};for(const k of Object.keys(t))t[k]+=Number.isFinite(Number(v[k]))?Number(v[k]):0}for(const[k,v]of Object.entries(t))patchTotal(group,k,v)}
    const all={power:0,today:0,yesterday:0,month:0};for(const id of Object.keys(DEVICES)){const v=state.metrics.get(id)||{};for(const k of Object.keys(all))all[k]+=Number.isFinite(Number(v[k]))?Number(v[k]):0}
    all.power+=FIXED_POWER_LOADS.reduce((sum,item)=>sum+item.power,0);
    for(const[k,v]of Object.entries(all))patchGrand(k,v);patchGrandLive(all.power)
  }
  async function sync(){if(state.syncing)return;state.syncing=true;try{if(!usableConfig())throw new Error('URL o token non configurati in config.js');const payload=await haFetch('/api/states');state.states=new Map(payload.map(e=>[e.entity_id,e]));Object.keys(DEVICES).forEach(updateDevice);updateTotals()}catch(e){console.error('[Consumi Totali]',e)}finally{state.syncing=false}}
  render();sync();setInterval(sync,5000);
})();
</script>
</body>
</html>
